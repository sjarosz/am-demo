# jrsz.net parallel stack - a full independent twin of the jrsz.org services.
#
# Both stacks share the jrsz_net network and run concurrently. Published host
# ports are deconflicted from jrsz.org:
#   am.jrsz.org  8443:8443   | am.jrsz.net  9443:9443   (AM listens on 9443 inside
#   ig.jrsz.org  443:8443    | ig.jrsz.net  8444:8443    the com container too)
#
# Domain/URL/port/cookie values are hardcoded here on purpose: docker compose
# `${VAR}` interpolation reads the root .env (jrsz.org), not .env.com. Shared
# passwords still interpolate from the root .env since both stacks use the same
# values. Runtime values consumed by the amster/app bootstrap scripts come from
# `env_file: .env.com`.
services:
  ds-com:
    build:
      context: .
      dockerfile: docker/ds/Dockerfile
      args:
        DS_ROOT_PASSWORD: ${DS_ROOT_PASSWORD}
        DS_MONITOR_PASSWORD: ${DS_MONITOR_PASSWORD}
        DS_AM_PROFILE_PASSWORD: ${DS_AM_PROFILE_PASSWORD}
    container_name: ds.jrsz.net
    hostname: ds.jrsz.net
    env_file:
      - .env.com
    environment:
      DS_SERVER_ID: ds-jrsz-com
      DS_SET_UID_ADMIN_AND_MONITOR_PASSWORDS: "true"
      DS_UID_ADMIN_PASSWORD: ${DS_ROOT_PASSWORD}
      DS_UID_MONITOR_PASSWORD: ${DS_MONITOR_PASSWORD}
      DS_ADVERTISED_LISTEN_ADDRESS: ds.jrsz.net
      USE_DEMO_KEYSTORE_AND_PASSWORDS: "false"
    networks:
      jrsz_net:
        aliases:
          - ds.jrsz.net
    volumes:
      - ds-data-com:/opt/opendj/data
      - ds-secrets-com:/opt/opendj/secrets
      - ./secrets/tls/ds-com/keystore:/opt/opendj/secrets/keystore:ro
      - ./secrets/tls/ds-com/keystore.pin:/opt/opendj/secrets/keystore.pin:ro
    command: ["start-ds"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/opendj/bin/ldapsearch --noPropertiesFile --no-prompt --useSsl --trustAll --hostname localhost --port 1636 --bindDn uid=monitor --bindPassword \"$$DS_UID_MONITOR_PASSWORD\" --baseDn \"\" --searchScope base '(objectClass=*)' 1.1 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    expose:
      - "1389"
      - "1636"
      - "4444"
      - "8989"

  am-com:
    build:
      context: .
      dockerfile: docker/am/Dockerfile
    container_name: am.jrsz.net
    hostname: am.jrsz.net
    env_file:
      - .env.com
    environment:
      KEYSTORE_FILE: ${AM_COM_KEYSTORE_FILE:-/run/secrets/tls/am-com.p12}
      KEYSTORE_PASSWORD: ${AM_KEYSTORE_PASSWORD}
      TRUSTSTORE_FILE: /run/secrets/trust/truststore.p12
      TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASSWORD}
      AM_URL: https://am.jrsz.net:9443/am
      AM_HTTPS_PORT: "9443"
    depends_on:
      ds-com:
        condition: service_healthy
    networks:
      jrsz_net:
        aliases:
          - am.jrsz.net
    volumes:
      - am-home-bootstrap-com:/home/forgerock/openam
      - ${AM_COM_TLS_DIR:-./secrets/tls/am-com}:/run/secrets/tls:ro
      - ./secrets/truststores:/run/secrets/trust:ro
      - ./config/amster:/opt/amster-config
    ports:
      - "9443:9443"
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS https://localhost:9443/am/ >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  amster-bootstrap-com:
    build:
      context: .
      dockerfile: docker/amster/Dockerfile
    container_name: amster-bootstrap.jrsz.net
    hostname: amster-bootstrap.jrsz.net
    env_file:
      - .env.com
    profiles:
      - bootstrap
    environment:
      AM_SERVER_URL: https://am.jrsz.net:9443/am
      AM_CFG_DIR: /home/forgerock/openam
      AM_COOKIE_DOMAIN: jrsz.net
      AM_USER_STORE_TYPE: LDAPv3ForOpenDS
      AM_CFG_STORE_HOST: ds.jrsz.net
      AM_CFG_STORE_PORT: "1636"
      AM_CFG_STORE_ADMIN_PORT: "4444"
      AM_CFG_STORE_ROOT_SUFFIX: ou=am-config
      AM_CFG_STORE_SSL: SSL
      AM_CFG_STORE_DIR_MGR: uid=am-config,ou=admins,ou=am-config
      AM_CFG_STORE_DIR_MGR_PWD: ${DS_AM_PROFILE_PASSWORD}
      AM_USER_STORE_HOST: ds.jrsz.net
      AM_USER_STORE_PORT: "1636"
      AM_USER_STORE_ROOT_SUFFIX: ou=identities
      AM_USER_STORE_SSL: SSL
      AM_USER_STORE_DIR_MGR: uid=am-identity-bind-account,ou=admins,ou=identities
      AM_USER_STORE_DIR_MGR_PWD: ${DS_AM_PROFILE_PASSWORD}
      AM_ADMIN_PASSWORD: ${AM_ADMIN_PASSWORD}
      TRUSTSTORE_PASSWORD: ${TRUSTSTORE_PASSWORD}
      # The /bravo OIDC -> horizon JWT-bearer feature targets the org stack only
      # (its signing keystore is mounted into amster-bootstrap on jrsz.org).
      BOOTSTRAP_OIDC_HORIZON: "false"
      # jrsz.net counterpart: /bravo as RFC 7523 IdP for the bonaire05 AIC tenant
      # (config/amster/oidc-bonaire, docs/bonaire05-jwt-bearer.md). Uses the separate
      # signing key in secrets/oidc-signing-net (mounted at /run/secrets/oidc below).
      BOOTSTRAP_OIDC_BONAIRE: ${BOOTSTRAP_OIDC_BONAIRE:-true}
      REMOTE_AS_NAME: ${REMOTE_AS_NAME:-bonaire05}
      REMOTE_AS_TOKEN_ENDPOINT: ${REMOTE_AS_TOKEN_ENDPOINT:-https://openam-bonaire05.forgeblocks.com:443/am/oauth2/realms/root/realms/alpha/access_token}
      BONAIRE_PORTAL_CLIENT_ID: ${BONAIRE_PORTAL_CLIENT_ID:-bonaire-portal}
      BONAIRE_PORTAL_CLIENT_SECRET: ${BONAIRE_PORTAL_CLIENT_SECRET:-bonaire-portal-secret-changeit}
      BONAIRE_PORTAL_SCOPES: ${BONAIRE_PORTAL_SCOPES:-openid profile email a2a:invoke}
      BONAIRE_DEMO_USER: ${BONAIRE_DEMO_USER:-acarter}
      BONAIRE_DEMO_USER_PASSWORD: ${BONAIRE_DEMO_USER_PASSWORD:-}
    depends_on:
      am-com:
        condition: service_healthy
      ds-com:
        condition: service_healthy
    networks:
      jrsz_net:
        aliases:
          - amster-bootstrap.jrsz.net
    volumes:
      - am-home-bootstrap-com:/home/forgerock/openam
      - ./secrets/truststores:/run/secrets/trust:ro
      - ./config/amster:/opt/amster-config
      - ./secrets/oidc-signing-net:/run/secrets/oidc:ro

  app1-com:
    build:
      context: .
      dockerfile: docker/app1/Dockerfile
      args:
        APP_DOMAIN: jrsz.net
    container_name: app1-backend.jrsz.net
    hostname: app1-backend.jrsz.net
    environment:
      SERVER_NAME: app1-backend.jrsz.net
      KEYSTORE_FILE: /run/secrets/tls/app1-com.p12
      KEYSTORE_PASSWORD: ${APP_KEYSTORE_PASSWORD}
    networks:
      jrsz_net:
        aliases:
          - app1-backend.jrsz.net
    volumes:
      - ./secrets/tls/app1-com:/run/secrets/tls:ro
    expose:
      - "8443"

  app2-com:
    build:
      context: .
      dockerfile: docker/app2/Dockerfile
      args:
        APP_DOMAIN: jrsz.net
    container_name: app2-backend.jrsz.net
    hostname: app2-backend.jrsz.net
    environment:
      SERVER_NAME: app2-backend.jrsz.net
      KEYSTORE_FILE: /run/secrets/tls/app2-com.p12
      KEYSTORE_PASSWORD: ${APP_KEYSTORE_PASSWORD}
    networks:
      jrsz_net:
        aliases:
          - app2-backend.jrsz.net
    volumes:
      - ./secrets/tls/app2-com:/run/secrets/tls:ro
    expose:
      - "8443"

  app3-com:
    build:
      context: .
      dockerfile: docker/app3/Dockerfile
      args:
        APP_DOMAIN: jrsz.net
    container_name: app3-backend.jrsz.net
    hostname: app3-backend.jrsz.net
    environment:
      SERVER_NAME: app3-backend.jrsz.net
      KEYSTORE_FILE: /run/secrets/tls/app3-com.p12
      KEYSTORE_PASSWORD: ${APP_KEYSTORE_PASSWORD}
    networks:
      jrsz_net:
        aliases:
          - app3-backend.jrsz.net
    volumes:
      - ./secrets/tls/app3-com:/run/secrets/tls:ro
    expose:
      - "8443"

  app4-com:
    build:
      context: .
      dockerfile: docker/app4/Dockerfile
    container_name: app4-backend.jrsz.net
    hostname: app4-backend.jrsz.net
    env_file:
      - .env.com
    environment:
      PORT: "3000"
      DEMO_BASE_URL: https://app4.jrsz.net:8444
      AM_BASE_URL: https://am.jrsz.net:9443/am
      OIDC_ISSUER_URL: https://am.jrsz.net:9443/am/oauth2/realms/root/realms/alpha
      AM_COOKIE_DOMAIN: jrsz.net
      CLIENT_ID: demo-pkce-app
      CLIENT_SECRET: ""
      NODE_EXTRA_CA_CERTS: /run/secrets/ca/jrsz-root-ca.cert.pem
      SESSION_SECRET: changeit-changeit-changeit
    networks:
      jrsz_net:
        aliases:
          - app4-backend.jrsz.net
    volumes:
      - ./secrets/tls/ca/jrsz-root-ca.cert.pem:/run/secrets/ca/jrsz-root-ca.cert.pem:ro
    expose:
      - "3000"

  app5-com:
    build:
      context: .
      dockerfile: docker/login-widget/Dockerfile
      args:
        VITE_AM_BASE_URL: https://am.jrsz.net:9443/am
        VITE_CLIENT_ID: sdkPublicClient
        VITE_JOURNEY: sdkUsernamePasswordJourney
    container_name: app5-backend.jrsz.net
    hostname: app5-backend.jrsz.net
    networks:
      jrsz_net:
        aliases:
          - app5-backend.jrsz.net
    expose:
      - "8080"

  app6-com:
    build:
      context: .
      dockerfile: docker/app6/Dockerfile
    container_name: app6-backend.jrsz.net
    hostname: app6-backend.jrsz.net
    env_file:
      - .env.com
    environment:
      PORT: "3000"
      APP6_BASE_URL: https://app6.jrsz.net:8444
      AM_BASE_URL: https://am.jrsz.net:9443/am
      AM_COOKIE_DOMAIN: jrsz.net
      AM_ADMIN_PASSWORD: ${AM_ADMIN_PASSWORD}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-demo-user}
      TIMEOUT_REALM: /timeout-test
      TIMEOUT_REALM_PATH: realms/root/realms/timeout-test
      OIDC_ISSUER_URL: https://am.jrsz.net:9443/am/oauth2/realms/root/realms/timeout-test
      RP_C_CLIENT_ID: rp-c-app
      RP_C_CLIENT_SECRET: rp-c-secret-changeit
      RP_D_CLIENT_ID: rp-d-app
      RP_D_CLIENT_SECRET: ""
      NODE_EXTRA_CA_CERTS: /run/secrets/ca/jrsz-root-ca.cert.pem
    networks:
      jrsz_net:
        aliases:
          - app6-backend.jrsz.net
    volumes:
      - ./secrets/tls/ca/jrsz-root-ca.cert.pem:/run/secrets/ca/jrsz-root-ca.cert.pem:ro
    expose:
      - "3000"

  app7-com:
    build:
      context: .
      dockerfile: docker/app7/Dockerfile
    container_name: app7-backend.jrsz.net
    hostname: app7-backend.jrsz.net
    env_file:
      - .env.com
    environment:
      PORT: "3000"
      LOCAL_SIDE: com
      APP7_BASE_URL: https://app7.jrsz.net:8444
      AM_BASE_URL: https://am.jrsz.net:9443/am
      AM_COOKIE_DOMAIN: jrsz.net
      AM_ADMIN_PASSWORD: ${AM_ADMIN_PASSWORD}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-demo-user}
      AM_REALM: /alpha
      AM_REALM_PATH: realms/root/realms/alpha
      ORG_AM_BASE_URL: https://am.jrsz.org:8443/am
      COM_AM_BASE_URL: https://am.jrsz.net:9443/am
      ORG_ENTITY_ID: https://am.jrsz.org:8443/am/jrsz-org
      COM_ENTITY_ID: https://am.jrsz.net:9443/am/jrsz-com
      ORG_IDP_METAALIAS: /alpha/idp-org
      ORG_SP_METAALIAS: /alpha/sp-org
      COM_IDP_METAALIAS: /alpha/idp-com
      COM_SP_METAALIAS: /alpha/sp-com
      NODE_EXTRA_CA_CERTS: /run/secrets/ca/jrsz-root-ca.cert.pem
    networks:
      jrsz_net:
        aliases:
          - app7-backend.jrsz.net
    volumes:
      - ./secrets/tls/ca/jrsz-root-ca.cert.pem:/run/secrets/ca/jrsz-root-ca.cert.pem:ro
    expose:
      - "3000"

  app9-com:
    build:
      context: .
      dockerfile: docker/app9/Dockerfile
    container_name: app9-backend.jrsz.net
    hostname: app9-backend.jrsz.net
    env_file:
      - .env.com
    environment:
      PORT: "3000"
      LOCAL_SIDE: com
      APP9_BASE_URL: https://app9.jrsz.net:8444
      AM_BASE_URL: https://am.jrsz.net:9443/am
      AM_COOKIE_DOMAIN: jrsz.net
      AM_ADMIN_PASSWORD: ${AM_ADMIN_PASSWORD}
      DEMO_USER_NAME: ${DEMO_USER_NAME:-demo-user}
      AM_REALM: /samllab
      AM_REALM_PATH: realms/root/realms/samllab
      ORG_AM_BASE_URL: https://am.jrsz.org:8443/am
      COM_AM_BASE_URL: https://am.jrsz.net:9443/am
      SAMLLAB_IDP_ENTITY_ID: https://am.jrsz.org:8443/am/samllab-idp
      SAMLLAB_SP_ENTITY_ID: https://am.jrsz.net:9443/am/samllab-sp
      SAMLLAB_IDP_METAALIAS: /samllab/idp
      SAMLLAB_SP_METAALIAS: /samllab/sp
      NODE_EXTRA_CA_CERTS: /run/secrets/ca/jrsz-root-ca.cert.pem
    networks:
      jrsz_net:
        aliases:
          - app9-backend.jrsz.net
    volumes:
      - ./secrets/tls/ca/jrsz-root-ca.cert.pem:/run/secrets/ca/jrsz-root-ca.cert.pem:ro
    expose:
      - "3000"

  gateway-com:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    container_name: ig.jrsz.net
    hostname: ig.jrsz.net
    env_file:
      - .env.com
    environment:
      # RFC 7523 bridge route (/bridge/bonaire05/token): jwt-bearer client at bonaire05 (values in .env)
      REMOTE_AS_TOKEN_ENDPOINT: ${REMOTE_AS_TOKEN_ENDPOINT:-https://openam-bonaire05.forgeblocks.com:443/am/oauth2/realms/root/realms/alpha/access_token}
      BONAIRE_JWT_CLIENT_ID: ${BONAIRE_JWT_CLIENT_ID:-jrsz-concierge}
      BONAIRE_JWT_CLIENT_SECRET: ${BONAIRE_JWT_CLIENT_SECRET:-}
      BONAIRE_JWT_SCOPE: ${BONAIRE_JWT_SCOPE:-a2a:invoke}
    depends_on:
      am-com:
        condition: service_healthy
      app1-com:
        condition: service_started
      app2-com:
        condition: service_started
      app3-com:
        condition: service_started
      app4-com:
        condition: service_started
      app5-com:
        condition: service_started
      app6-com:
        condition: service_started
      app7-com:
        condition: service_started
      app9-com:
        condition: service_started
    networks:
      jrsz_net:
        aliases:
          - ig.jrsz.net
          - app1.jrsz.net
          - app2.jrsz.net
          - app3.jrsz.net
          - app4.jrsz.net
          - app5.jrsz.net
          - app6.jrsz.net
          - app7.jrsz.net
          - app9.jrsz.net
    volumes:
      - ./config/gateway-com:/var/gateway/config:ro
      - ./config/gateway-com/scripts:/var/gateway/scripts:ro
      - ${GATEWAY_COM_TLS_DIR:-./secrets/tls/gateway-com}:/var/gateway/secrets/tls:ro
      - ./secrets/truststores:/var/gateway/secrets/trust:ro
      - ./secrets/passwords/gateway:/var/gateway/secrets/passwords:ro
    ports:
      - "8444:8443"

  # Remote Connector Server for the bonaire05 AIC tenant. Hosts the LDAP
  # connector that exposes ds.jrsz.net (ou=identities) to the tenant; the
  # tenant's LDAP application + mapping (scripts/provision_bonaire05_ldap_app.py)
  # onboards those users as alpha_users with DS as the authoritative source.
  # RCS_* values come from .env.com; RCS_NAME must equal the connector server
  # name registered in the tenant. Outbound-only (wss to the tenant), no ports.
  rcs-com:
    build:
      context: .
      dockerfile: docker/rcs/Dockerfile
    container_name: rcs.jrsz.net
    hostname: rcs.jrsz.net
    env_file:
      - .env.com
    depends_on:
      ds-com:
        condition: service_healthy
    networks:
      jrsz_net:
        aliases:
          - rcs.jrsz.net
    volumes:
      - ./secrets/tls/ca/jrsz-root-ca.cert.pem:/run/secrets/ca/jrsz-root-ca.cert.pem:ro
      - ./secrets/rcs:/run/secrets/rcs:ro
      - rcs-logs-com:/opt/openicf/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep operational= /opt/openicf/logs/ConnectorServer.log | tail -1 | grep -q operational=true",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 150s

networks:
  jrsz_net:
    name: jrsz_net

volumes:
  am-home-bootstrap-com:
  ds-data-com:
  ds-secrets-com:
  rcs-logs-com:
